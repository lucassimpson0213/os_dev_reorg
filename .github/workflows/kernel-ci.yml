name: kernel-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [stable]

jobs:
  boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build + boot deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            xorriso \
            mtools \
            qemu-system-x86 \
            grub-common \
            grub-pc-bin

      # Your Makefile uses i686-elf-gcc, which is NOT available by default on ubuntu-latest.
      # This installs a prebuilt cross compiler toolchain.
      - name: Install i686-elf cross toolchain
        run: |
          set -euo pipefail
          mkdir -p $HOME/opt
          curl -L -o toolchain.tar.xz https://github.com/lordmilko/i686-elf-tools/releases/latest/download/i686-elf-tools-linux.tar.xz
          tar -xJf toolchain.tar.xz -C $HOME/opt
          echo "$HOME/opt/i686-elf-tools/bin" >> $GITHUB_PATH

      - name: Build kernel + ISO
        run: |
          set -euo pipefail
          make clean
          make iso

      - name: GRUB boot smoke test (must print marker)
        run: |
          set -euo pipefail
          # run-grub already uses -serial stdio, so we can capture it
          timeout 30s make run-grub > bootlog.txt 2>&1 || true
          echo "----- bootlog.txt (last 200 lines) -----"
          tail -n 200 bootlog.txt

          # Change this to whatever your kernel prints early
          grep -n "KERNEL_BOOT_OK" bootlog.txt
