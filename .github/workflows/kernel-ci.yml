name: kernel-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [stable]

jobs:
  boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Base build + boot dependencies
      # ------------------------------------------------
      - name: Install build + boot deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-i686-linux-gnu \
            nasm \
            xorriso \
            mtools \
            qemu-system-x86 \
            grub-common \
            grub-pc-bin

      # ------------------------------------------------
      # Tell the Makefile to use the CI compiler
      # (this overrides CC ?= i686-elf-gcc)
      # ------------------------------------------------
      - name: Configure compiler for CI
        run: echo "CC=i686-linux-gnu-gcc" >> $GITHUB_ENV

      # ------------------------------------------------
      # Build the kernel and ISO
      # ------------------------------------------------
      - name: Build kernel + ISO
        run: |
          set -euo pipefail
          make clean
          make iso

      # ------------------------------------------------
      # Boot test via GRUB inside QEMU
      # ------------------------------------------------
      - name: GRUB boot smoke test (must print marker)
        run: |
          set -euo pipefail
          timeout 30s make run-grub > bootlog.txt 2>&1 || true

          echo "----- bootlog.txt (last 200 lines) -----"
          tail -n 200 bootlog.txt

          # This string MUST exist in your early kernel output
          grep -n "KERNEL_BOOT_OK" bootlog.txt
