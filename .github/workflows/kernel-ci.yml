name: kernel-ci

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: boot-gate-pr-dev
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simpson-systems/kernel-ci
          tags: |
            type=sha
            type=raw,value=dev

      - name: Choose container image ref (single tag)
        id: out
        run: |
          echo "image=ghcr.io/simpson-systems/kernel-ci:dev" >> "$GITHUB_OUTPUT"

      - name: Build + push (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/kernel-ci.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  boot-and-open-pr:
    needs: build-image
    runs-on: ubuntu-latest

    # IMPORTANT: run bash by default so pipefail works
    defaults:
      run:
        shell: bash

    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install a toolchain explicitly BEFORE rust-cache (rust-cache runs `rustc -vV`)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/crates/kernel -> rust/target

      - name: Build ISO
        working-directory: rust/crates/kernel
        run: |
          set -euo pipefail
          make run-grub

      - name: Boot in QEMU (GRUB)
        working-directory: rust/crates/kernel
        run: |
          set -euo pipefail
          timeout 25s make run-grub | tee qemu.log

      - name: Open PR dev -> stable (only if none exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE="stable"
          HEAD="dev"
          TITLE="Merge dev -> stable (boot verified)"
          BODY=$'Auto PR: CI successfully booted the kernel via GRUB + QEMU.\n\n- Trigger: push to dev\n- Build: make iso\n- Boot: make run-grub\n\nIf a PR already exists for dev->stable, this workflow won’t create another.'

          existing="$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq 'length')"
          if [ "$existing" -gt 0 ]; then
            echo "PR already exists for $HEAD -> $BASE. Skipping."
            exit 0
          fi

          gh pr create --base "$BASE" --head "$HEAD" --title "$TITLE" --body "$BODY"
