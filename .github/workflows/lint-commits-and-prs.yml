name: Lint Commits + PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for commit ranges)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ PR title lint (Conventional Commits)
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # keep this list tight so your history stays clean
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Subject should not start with a capital letter."

      # ✅ Commit message lint (Conventional Commits)
      # To keep this "one-file only", we generate a minimal commitlint config on the fly.
      - name: Write commitlint config
        run: |
          cat > commitlint.config.cjs <<'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
          };
          EOF

      - name: Install commitlint (local)
        run: npm i -D @commitlint/cli @commitlint/config-conventional

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6
